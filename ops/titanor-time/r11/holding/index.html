<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Titanor Time</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e6e8ec;
  }
  main {
    max-width: 440px;
    text-align: center;
  }
  .mark {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #8b929e;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  p {
    margin: 0 0 8px;
    color: #b6bcc6;
  }
  .en {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #262b33;
    color: #8b929e;
    font-size: 15px;
  }
</style>
</head>
<body>
<main>
  <div class="mark">Titanor Time</div>
  <h1>Идёт подготовка к запуску</h1>
  <p>Система учёта рабочего времени скоро откроется.</p>
  <p>Если вход нужен сейчас — обратитесь к администратору.</p>
  <div class="en">
    <p><strong>Getting ready for launch.</strong> The time-tracking system will be available shortly. Contact your administrator if you need access now.</p>
  </div>
</main>
</body>
</html>
