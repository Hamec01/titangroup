name: titanor-time

# Isolated stack for Titanor Time (PostgreSQL 16 + Next.js app scaffold).
# Fully separate Compose project from `titanorgroup` (public site, compose.yaml)
# and from CollabStudio (separate project entirely) — no shared network, volume,
# image, or secrets with either.
#
# This file only defines infrastructure. It is not started as part of this task.
# See docs/titanor-time/06_DATABASE_INFRASTRUCTURE.md for how to use it.
#
# `app` is a bare scaffold (no login, no real UI/API yet) now connected to `db`
# via Prisma Client — see titanor-time-app/. Build context is the repository
# root so the image build can reach the single shared ../prisma/schema.prisma
# without copying/duplicating it (see titanor-time-app/Dockerfile and its
# paired titanor-time-app/Dockerfile.dockerignore).
#
# `app` is attached to two networks: `internal` (shared with `db`, so it can
# reach it by service name — this network has no gateway/outbound routing at
# all) and `lan` (a plain, non-internal bridge network). `lan` is required
# because a Docker network with `internal: true` also blocks the
# host-to-container port-publishing path, not just outbound container
# traffic — `app`'s 127.0.0.1:3200 mapping does not work on `internal` alone.
# As a side effect `lan` does give `app` normal outbound internet access
# (that is what "non-internal" means); `db` is not on `lan` and stays fully
# unreachable from outside Docker on `internal` only.

services:
  app:
    build:
      context: .
      dockerfile: titanor-time-app/Dockerfile
    restart: unless-stopped
    init: true

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - path: .env.titanor-time
        required: false

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    ports:
      - "127.0.0.1:3200:3000"

    networks:
      - internal
      - lan

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16
    restart: unless-stopped

    env_file:
      - path: .env.titanor-time
        required: false

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - internal

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  internal:
    internal: true
  lan: {}

volumes:
  db_data:
